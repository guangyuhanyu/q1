<style>
  /* =========================================================
     BẢNG MÀU — phối từ bảng "Chinese Colors · 灰色" (tông xám cổ phong)
     珍珠 Ngọc Trai · 玛瑙 Mã Não · 晓灰 Hiểu Hôi · 芦穗 Lô Tuệ
     月灰 Nguyệt Hôi · 镍灰 Niken Hôi · 夜灰 Dạ Hôi
     + 1 điểm nhấn son triện (ấn chương trong tranh thủy mặc)
     ========================================================= */
  :root{
    --ngoc-trai: #F1ECE3;   /* nền tổng thể, sáng nhất */
    --ma-nao:    #DCD6CD;   /* nền panel phụ */
    --hieu-hoi:  #D8C9B8;   /* highlight ấm */
    --lo-tue:    #BDAEAD;   /* viền, đường phân cách */
    --nguyet-hoi:#B6A476;   /* vàng trầm — nhấn tiêu đề, số bài */
    --niken-hoi: #8E948A;   /* chữ phụ, nhãn */
    --da-hoi:    #423C34;   /* mực — chữ chính */
    --da-hoi-2:  #6B6459;
    --son-trien: #A24B3C;   /* đỏ triện — điểm nhấn duy nhất */
    --trang:     #FFFDF9;
  }

  *{ box-sizing:border-box; }

  html{ background:var(--ngoc-trai); }

  body{
    position:relative;
    margin:0;
    background:var(--ngoc-trai);
    font-family:'Be Vietnam Pro', sans-serif;
    color:var(--da-hoi);
    min-height:100vh;
  }

  .header, .wrap{ position:relative; z-index:1; }

  .wrap{ max-width:1040px; margin:0 auto; padding:18px 20px 70px; }

  .header::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(66,60,52,0.08) 0%, rgba(66,60,52,0) 30%);
    pointer-events:none;
  }
  .header-inner{ position:relative; z-index:1; }

  .eyebrow{
    font-family:'Noto Sans SC', sans-serif;
    font-size:.72rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--da-hoi-2);
    margin:0 0 10px;
  }

  .title-cn{
    font-family:'Noto Serif SC', serif;
    font-weight:900;
    font-size:clamp(1.7rem, 4.4vw, 2.5rem);
    color:var(--da-hoi);
    margin:0;
    letter-spacing:.05em;
    text-shadow: 0 1px 0 rgba(255,253,249,0.5);
  }
  .title-vi{
    font-family:'Be Vietnam Pro', sans-serif;
    font-weight:800;
    font-size:clamp(1.1rem, 2.6vw, 1.5rem);
    color:var(--da-hoi);
    margin:8px 0 4px;
  }
  .title-sub{
    font-family:'Be Vietnam Pro', sans-serif;
    font-weight:500;
    font-size:.88rem;
    color:var(--da-hoi-2);
    margin:0 0 14px;
    letter-spacing:.02em;
  }

  .divider{
    display:flex; align-items:center; justify-content:center; gap:14px;
    color:var(--nguyet-hoi);
    margin:0 0 12px;
  }
  .divider .line{ width:64px; height:1px; background:linear-gradient(90deg, transparent, var(--lo-tue), transparent); }
  .divider .mark{ font-size:1.05rem; }

  .header-credit{
    font-family:'Noto Sans SC', sans-serif;
    font-size:.82rem;
    color:var(--da-hoi-2);
    letter-spacing:.05em;
  }
  .header-credit b{ color:var(--da-hoi); font-weight:700; }

  .logo{
    width:52px; height:52px;
    border-radius:11px;
    margin:0 auto 12px;
    display:block;
    box-shadow:0 6px 18px -8px rgba(66,60,52,0.45);
  }

  /* ===================== GIỚI THIỆU NGẮN ===================== */
  .intro{
    max-width:640px;
    margin:26px auto 34px;
    text-align:center;
    color:var(--da-hoi-2);
    font-size:.98rem;
    line-height:1.7;
  }

  /* ===================== BỐ CỤC 2 CỘT: MENU + NỘI DUNG ===================== */
  .app-layout{
    display:flex;
    align-items:flex-start;
    gap:22px;
    margin-bottom:10px;
  }

  /* ---- Sidebar / menu trái ---- */
  .sidebar{
    width:296px;
    flex-shrink:0;
    background:var(--trang);
    border:1px solid var(--ma-nao);
    border-radius:16px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    background:var(--ngoc-trai);
    border:1px solid var(--ma-nao);
    border-radius:13px;
    padding:14px 14px;
    cursor:pointer;
    text-align:left;
    font-family:'Be Vietnam Pro', sans-serif;
    transition:background .15s ease, border-color .15s ease, transform .12s ease;
  }
  .nav-item:hover{ transform:translateY(-1px); border-color:var(--lo-tue); }
  .nav-icon{
    width:44px; height:44px;
    flex-shrink:0;
    border-radius:11px;
    background:var(--hieu-hoi);
    color:var(--da-hoi);
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif SC', serif;
    font-weight:700;
    font-size:1.15rem;
    transition:background .15s ease, color .15s ease;
  }
  .nav-text{ flex:1; min-width:0; }
  .nav-title{ font-weight:700; font-size:1rem; color:var(--da-hoi); }
  .nav-sub{ font-size:.78rem; color:var(--niken-hoi); margin-top:1px; }
  .nav-count{
    flex-shrink:0;
    min-width:28px;
    text-align:center;
    font-family:'Noto Sans SC', sans-serif;
    font-weight:700;
    font-size:.82rem;
    color:var(--da-hoi-2);
    background:var(--ma-nao);
    border-radius:999px;
    padding:4px 9px;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item.active{
    background:var(--da-hoi);
    border-color:var(--da-hoi);
  }
  .nav-item.active .nav-title{ color:var(--trang); }
  .nav-item.active .nav-sub{ color:var(--ma-nao); }
  .nav-item.active .nav-icon{ background:var(--son-trien); color:var(--trang); }
  .nav-item.active .nav-count{ background:var(--nguyet-hoi); color:var(--da-hoi); }

  .sidebar-footnote{
    font-size:.78rem;
    color:var(--niken-hoi);
    text-align:center;
    padding:6px 4px 2px;
    line-height:1.5;
  }

  /* ---- Content / danh sách bên phải ---- */
  .content{
    flex:1;
    min-width:0;
    background:var(--trang);
    border:1px solid var(--ma-nao);
    border-radius:16px;
    padding:20px 20px 10px;
  }
  .content-header{
    display:flex; align-items:center; gap:12px;
    margin-bottom:14px;
    padding-bottom:14px;
    border-bottom:1px solid var(--ma-nao);
  }
  .back-btn{
    display:none;
    align-items:center; justify-content:center;
    width:36px; height:36px;
    border-radius:10px;
    background:var(--ngoc-trai);
    border:1px solid var(--ma-nao);
    color:var(--da-hoi);
    font-size:1.05rem;
    cursor:pointer;
    flex-shrink:0;
  }
  .content-title{
    font-family:'Noto Serif SC', serif;
    font-weight:700;
    font-size:1.1rem;
    color:var(--da-hoi);
  }
  .content-title small{
    display:block;
    font-family:'Be Vietnam Pro', sans-serif;
    font-weight:500;
    font-size:.78rem;
    color:var(--niken-hoi);
    margin-top:2px;
  }

  .list{ display:none; flex-direction:column; gap:9px; padding-bottom:16px; }
  body.panel-luyen .list-luyen{ display:flex; }
  body.panel-nghe .list-nghe{ display:flex; }

  .row{
    display:flex; align-items:center; gap:14px;
    text-decoration:none;
    padding:12px 12px;
    border:1px solid var(--ma-nao);
    border-radius:12px;
    transition:background .15s ease, border-color .15s ease, transform .12s ease;
  }
  .row:hover{ background:var(--ngoc-trai); border-color:var(--lo-tue); transform:translateX(2px); }
  .row-seal{
    width:34px; height:34px;
    flex-shrink:0;
    border-radius:8px;
    background:var(--hieu-hoi);
    color:var(--da-hoi);
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif SC', serif;
    font-weight:700;
    font-size:.88rem;
  }
  .list-nghe .row-seal{ background:var(--nguyet-hoi); }
  .row-text{ flex:1; min-width:0; }
  .row-label{
    font-family:'Noto Sans SC', sans-serif;
    font-size:.72rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--niken-hoi);
  }
  .row-cn{
    font-family:'Noto Serif SC', serif;
    font-weight:700;
    font-size:1.02rem;
    color:var(--da-hoi);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row-arrow{ flex-shrink:0; color:var(--niken-hoi); font-size:1.1rem; }

  /* ---- Responsive: điện thoại chuyển hẳn màn hình, có nút quay lại ---- */
  @media (max-width:768px){
    .app-layout{ display:block; }
    .sidebar{ width:100%; display:none; }
    .content{ display:none; }
    body.mobile-menu .sidebar{ display:flex; }
    body:not(.mobile-menu) .content{ display:block; }
    body:not(.mobile-menu) .back-btn{ display:flex; }
  }

  /* ===================== FOOTER / LIÊN HỆ ===================== */
  .footer{
    margin-top:54px;
    text-align:center;
    padding-top:30px;
    border-top:1px solid var(--lo-tue);
  }
  .footer p{
    margin:0 0 8px;
    color:var(--da-hoi-2);
    font-size:.92rem;
  }
  .footer .zalo{
    display:inline-block;
    font-family:'Noto Sans SC', sans-serif;
    font-weight:700;
    color:var(--da-hoi);
    background:var(--hieu-hoi);
    border:1px solid var(--nguyet-hoi);
    padding:9px 20px;
    border-radius:999px;
    margin-top:6px;
    letter-spacing:.02em;
  }
  .footer .credit{
    margin-top:18px;
    font-size:.8rem;
    color:var(--niken-hoi);
    letter-spacing:.03em;
  }
</style>
</head>

  ];

  function renderList(el, urlKey, external){
    var html = "";
    for(var i=0;i<LESSONS.length;i++){
      var l = LESSONS[i];
      html += '<a class="row" href="'+l[urlKey]+'"'+(external?' target="_blank" rel="noopener"':'')+'>'
            +   '<span class="row-seal">'+l.so+'</span>'
            +   '<span class="row-text">'
            +     '<span class="row-label">Bài '+l.n+'</span>'
            +     '<span class="row-cn">'+l.cn+'</span>'
            +   '</span>'
            +   '<span class="row-arrow">'+(external?'↗':'›')+'</span>'
            + '</a>';
    }
    el.innerHTML = html;
  }
  renderList(document.getElementById('listLuyen'), 'file', false);
  renderList(document.getElementById('listNghe'), 'audio', true);

  var body = document.body;
  var navLuyen = document.getElementById('navLuyen');
  var navNghe = document.getElementById('navNghe');
  var backBtn = document.getElementById('backBtn');
  var titleEl = document.getElementById('contentTitle');

  var TITLES = {
    luyen: '1. Luyện Tập<small>15 bài học</small>',
    nghe:  '2. File Nghe<small>15 bài học</small>'
  };

  function setPanel(name){
    body.classList.remove('panel-luyen','panel-nghe');
    body.classList.add('panel-'+name);
    body.classList.remove('mobile-menu');
    navLuyen.classList.toggle('active', name==='luyen');
    navNghe.classList.toggle('active', name==='nghe');
    titleEl.innerHTML = TITLES[name];
  }

  navLuyen.addEventListener('click', function(){ setPanel('luyen'); });
  navNghe.addEventListener('click', function(){ setPanel('nghe'); });
  backBtn.addEventListener('click', function(){ body.classList.add('mobile-menu'); });

  /* trạng thái khởi đầu: máy tính hiện luôn 2 cột (mục Luyện Tập);
     điện thoại hiện menu trước, bấm mới sang danh sách */
  body.classList.add('panel-luyen', 'mobile-menu');
</script>
</body>
